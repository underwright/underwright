# Drop-in for the ops host unit, installed by ops/install-ops-host.sh as
#   ~/.config/systemd/user/<unit>.d/10-always-on.conf
# where <unit> is omnigent.service (combined daemon, as on minipc) or the
# omnigent-host.service that `omnigent host enable` writes. The generated
# omnigent-host.service uses Restart=on-failure and RestartPreventExitStatus=78 143,
# so a clean exit or a stray SIGTERM (143) leaves the host down. The ops host
# must be always-on: UI sessions can only land on a host that is up. An explicit
# `systemctl --user stop` still stops it. Exit 78 (EX_CONFIG) still stops the
# restarts, so a broken config does not loop.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=10s
RestartPreventExitStatus=
RestartPreventExitStatus=78
