name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run depcruise
      - run: npm run test:coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - name: Report coverage evidence
        run: npm run report:coverage
        env:
          UNDERWRIGHT_URL: ${{ secrets.UNDERWRIGHT_URL }}
          UNDERWRIGHT_TOKEN: ${{ secrets.UNDERWRIGHT_TOKEN }}
          UNDERWRIGHT_TASK_ID: ${{ secrets.UNDERWRIGHT_TASK_ID }}
      - run: npm run test:contract
      - run: npm audit --audit-level=high
      - name: Report CI evidence
        if: always()
        uses: ./action/evidence-check
        with:
          url: ${{ secrets.UNDERWRIGHT_URL }}
          token: ${{ secrets.UNDERWRIGHT_TOKEN }}
          task-id: ${{ secrets.UNDERWRIGHT_TASK_ID }}
          kind: ci_check
          status: ${{ job.status }}
          command: npm run build && npm test && npm run test:contract
