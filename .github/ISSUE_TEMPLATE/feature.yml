name: Feature
description: A change to the control plane or its adapters
title: "feat: "
labels: ["enhancement", "type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Bound the change. Agents treat the acceptance-criterion ids as the evidence gate (`AGENTS.md`).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who hits this, and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
    validations:
      required: true
  - type: input
    id: ac-ids
    attributes:
      label: Acceptance criteria ids
      description: Comma-separated ids. Each one needs evidence before the task is done.
      placeholder: scope,tests,review
    validations:
      required: true
  - type: dropdown
    id: estimate
    attributes:
      label: Effort
      description: Agent-sessions, not person-weeks.
      options:
        - S
        - M
        - L
    validations:
      required: true
